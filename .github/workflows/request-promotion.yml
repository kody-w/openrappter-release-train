name: Request promotion
on:
  workflow_dispatch:
    inputs:
      source_manifest_url:
        description: Immutable finalized source manifest URL
        required: true
        type: string
      target_ring:
        required: true
        type: choice
        options: [alpha, canary, beta, stable]
permissions:
  contents: write
concurrency:
  group: request-${{ inputs.target_ring }}
  cancel-in-progress: false
jobs:
  request:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_URL: ${{ inputs.source_manifest_url }}
          TARGET_RING: ${{ inputs.target_ring }}
        run: |
          set -euo pipefail
          read -r source_repo source_ref source_ring <<EOF
          $(python - "$SOURCE_URL" <<'PY'
          import re,sys
          m=re.fullmatch(r"https://raw\.githubusercontent\.com/kody-w/(openrappter(?:-(nightly|alpha|canary|beta))?)/([0-9a-f]{40})/\.ring/manifest\.json",sys.argv[1])
          if not m: raise SystemExit("source manifest URL is not immutable/allowlisted")
          print(f"kody-w/{m.group(1)} {m.group(3)} {m.group(2) or 'stable'}")
          PY
          )
          EOF
          curl -fsSL --proto '=https' "$SOURCE_URL" -o source.json
          promotion_id="$(python -c 'import json; print(json.load(open("source.json"))["promotion_id"])')"
          curl -fsSL --proto '=https' \
            "https://raw.githubusercontent.com/kody-w/openrappter-release-train/main/heads/$source_ring.json" \
            -o source-head.json
          receipt_path="$(python -c 'import json; print(json.load(open("source-head.json"))["receipt_path"])')"
          receipt_commit="$(python -c 'import json; print(json.load(open("source-head.json"))["authority_commit"])')"
          test "$(python -c 'import json; print(json.load(open("source-head.json"))["promotion_id"])')" = "$promotion_id"
          test "$(python -c 'import json; print(json.load(open("source-head.json"))["target_manifest_commit"])')" = "$source_ref"
          curl -fsSL --proto '=https' \
            "https://raw.githubusercontent.com/kody-w/openrappter-release-train/$receipt_commit/$receipt_path" \
            -o source-receipt.json
          target_manifest_commit="$(python -c 'import json; print(json.load(open("source-receipt.json"))["target_manifest_commit"])')"
          curl -fsSL --proto '=https' \
            "https://raw.githubusercontent.com/$source_repo/$target_manifest_commit/.ring/manifest.json" \
            -o immutable-source.json
          python scripts/ringctl.py verify-source --manifest source.json \
            --receipt source-receipt.json --immutable immutable-source.json \
            --repository "$source_repo" --ring "$source_ring"
          target_repo="$(python - "$TARGET_RING" <<'PY'
          import sys
          print("kody-w/openrappter" if sys.argv[1]=="stable" else f"kody-w/openrappter-{sys.argv[1]}")
          PY
          )"
          curl -fsSL --proto '=https' \
            "https://raw.githubusercontent.com/kody-w/openrappter-release-train/main/heads/$TARGET_RING.json" \
            -o target-head.json
          target_head="$(python -c 'import json; print(json.load(open("target-head.json"))["target_manifest_commit"])')"
          curl -fsSL --proto '=https' \
            "https://raw.githubusercontent.com/$target_repo/$target_head/.ring/manifest.json" \
            -o previous.json
          git clone --filter=blob:none https://github.com/kody-w/openrappter.git canonical
          python scripts/ringctl.py promote source.json --to "$TARGET_RING" \
            --previous previous.json --checkout canonical \
            --target-base-commit "$target_head" --sequence 1 > request.json
          queue="$(python scripts/request_queue.py enqueue --root . --request request.json)"
          changed="$(printf '%s' "$queue" | python -c 'import json,sys; print(str(json.load(sys.stdin)["changed"]).lower())')"
          if [ "$changed" = false ]; then echo "request already queued"; exit 0; fi
          request_path="$(printf '%s' "$queue" | python -c 'import json,sys; print(json.load(sys.stdin)["path"])')"
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$request_path" "request-index/$TARGET_RING.json"
          git commit -m "request: $TARGET_RING"
          git push origin HEAD:main
