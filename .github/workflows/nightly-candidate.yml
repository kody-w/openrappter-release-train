name: Validate nightly candidate

on:
  repository_dispatch:
    types: [nightly-candidate]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail closed without cross-repository authority
        env:
          RING_AUTHORITY_TOKEN: ${{ secrets.RING_AUTHORITY_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "${RING_AUTHORITY_TOKEN:-}" ] ||
            { echo "::error::RING_AUTHORITY_TOKEN is required"; exit 1; }
      - name: Verify canonical ancestry and measure archive
        env:
          SOURCE_REPOSITORY: ${{ github.event.client_payload.source_repository }}
          SOURCE_COMMIT: ${{ github.event.client_payload.source_commit }}
        run: |
          set -euo pipefail
          [ "$SOURCE_REPOSITORY" = "kody-w/openrappter" ] ||
            { echo "::error::unauthorized source repository"; exit 1; }
          printf '%s' "$SOURCE_COMMIT" | grep -Eq '^[0-9a-f]{40}$' ||
            { echo "::error::malformed source commit"; exit 1; }
          git clone --filter=blob:none https://github.com/kody-w/openrappter.git source
          git -C source merge-base --is-ancestor "$SOURCE_COMMIT" origin/main
          version="$(git -C source show "$SOURCE_COMMIT:typescript/package.json" | python -c 'import json,sys; print(json.load(sys.stdin)["version"])')"
          artifact_url="https://github.com/kody-w/openrappter/archive/$SOURCE_COMMIT.tar.gz"
          curl -fsSL --proto '=https' "$artifact_url" -o candidate.tar.gz
          {
            echo "version=$version"
            echo "artifact_url=$artifact_url"
            echo "artifact_sha256=$(sha256sum candidate.tar.gz | cut -d' ' -f1)"
          } >> "$GITHUB_ENV"
      - name: Dispatch measured nightly pointer candidate
        env:
          GH_TOKEN: ${{ secrets.RING_AUTHORITY_TOKEN }}
          SOURCE_COMMIT: ${{ github.event.client_payload.source_commit }}
        run: |
          set -euo pipefail
          gh api repos/kody-w/openrappter-nightly/dispatches \
            -f event_type=ring-promotion \
            -F "client_payload[source_commit]=$SOURCE_COMMIT" \
            -F "client_payload[source_tag]=" \
            -F "client_payload[version]=$version-nightly.$(date -u +%Y%m%d)+g${SOURCE_COMMIT:0:8}" \
            -F "client_payload[artifact_url]=$artifact_url" \
            -F "client_payload[artifact_sha256]=$artifact_sha256" \
            -F "client_payload[ci_run_id]=${{ github.event.client_payload.ci_run_id }}"
