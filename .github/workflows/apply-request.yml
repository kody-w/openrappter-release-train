name: Apply next ordered promotion request
on:
  workflow_call:
    inputs:
      requested_sequence:
        required: false
        type: string
        default: '0'
      target_ring: { required: true, type: string }
      target_repository: { required: true, type: string }
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: target
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: kody-w/openrappter-release-train
          ref: main
          path: authority
      - env:
          GH_TOKEN: ${{ github.token }}
          TARGET_RING: ${{ inputs.target_ring }}
          TARGET_REPOSITORY: ${{ inputs.target_repository }}
          REQUESTED_SEQUENCE: ${{ inputs.requested_sequence }}
        run: |
          set -euo pipefail
          if ! [[ "$REQUESTED_SEQUENCE" =~ ^(0|[1-9][0-9]*)$ ]]; then
            echo "::error::requested_sequence must be zero or a positive integer"
            exit 1
          fi
          gh api "repos/$TARGET_REPOSITORY/rules/branches/main" > target-rules.json
          python - <<'PY'
          import json
          rules = json.load(open("target-rules.json"))
          required = {"deletion", "non_fast_forward"}
          present = {rule.get("type") for rule in rules}
          if not required <= present:
              raise SystemExit("target main must enforce deletion and non-fast-forward rules")
          PY
          request_commit="$(git -C authority rev-parse HEAD)"
          finalized="$(python -c 'import json; print(json.load(open("authority/heads/'"$TARGET_RING"'.json"))["sequence"])')"
          applied="$finalized"
          if cursor_content="$(gh api "repos/$TARGET_REPOSITORY/contents/.ring/applied-cursor.json?ref=main" \
              --jq .content 2>/dev/null)"; then
            printf '%s' "$cursor_content" | base64 --decode > old-applied-cursor.json
            applied="$(python -c 'import json; print(json.load(open("old-applied-cursor.json"))["sequence"])')"
          fi
          if [ "$applied" -gt "$finalized" ]; then
            echo "sequence $applied is applied but not finalized; waiting"
            exit 0
          fi
          select_args=(--index "authority/request-index/$TARGET_RING.json" --cursor "$finalized" --applied "$applied")
          if [ "$REQUESTED_SEQUENCE" -gt 0 ]; then select_args+=(--sequence "$REQUESTED_SEQUENCE"); fi
          selected="$(PYTHONPATH=authority/scripts python authority/scripts/request_queue.py select "${select_args[@]}")"
          request_path="$(printf '%s' "$selected" | python -c 'import json,sys; v=json.load(sys.stdin); print(v["path"] if v else "")')"
          [ -n "$request_path" ] || { echo "no unapplied request"; exit 0; }
          cp "authority/$request_path" request.json
          head="$(git -C target rev-parse HEAD)"
          PYTHONPATH=authority/scripts python authority/scripts/target_receiver.py prepare \
            --payload request.json --current target/.ring/manifest.json \
            --output proposed.json --target-ring "$TARGET_RING" \
            --target-repository "$TARGET_REPOSITORY" --current-head "$head" \
            --target-checkout target
          git clone --filter=blob:none https://github.com/kody-w/openrappter.git canonical
          previous="$(python -c 'import json; print(json.load(open("request.json"))["target_previous_source_commit"])')"
          proposed="$(python -c 'import json; print(json.load(open("request.json"))["source_commit"])')"
          tag="$(python -c 'import json; print(json.load(open("request.json"))["source_tag"] or "")')"
          git -C canonical merge-base --is-ancestor "$previous" "$proposed"
          git -C canonical merge-base --is-ancestor "$proposed" origin/main
          if [ -n "$tag" ]; then test "$(git -C canonical rev-list -n 1 "$tag")" = "$proposed"; fi
          artifact_url="$(python -c 'import json; print(json.load(open("request.json"))["artifact_url"])')"
          artifact_sha="$(python -c 'import json; print(json.load(open("request.json"))["artifact_sha256"])')"
          curl -fsSL --proto '=https' "$artifact_url" -o artifact
          echo "$artifact_sha  artifact" | sha256sum -c -
          current_digest="$(python -c 'import json,hashlib; v=json.load(open("target/.ring/manifest.json")); print(hashlib.sha256(json.dumps(v,sort_keys=True,separators=(",",":")).encode()).hexdigest())')"
          proposed_digest="$(python -c 'import json; print(json.load(open("request.json"))["target_manifest_sha256"])')"
          if [ "$current_digest" != "$proposed_digest" ]; then
            blob="$(git -C target rev-parse HEAD:.ring/manifest.json)"
            content="$(base64 < proposed.json | tr -d '\n')"
            gh api "repos/$TARGET_REPOSITORY/contents/.ring/manifest.json" --method PUT \
              -f "message=ring: apply ordered request" -f content="$content" \
              -f sha="$blob" -f branch=main
          fi
          target_commit="$(gh api "repos/$TARGET_REPOSITORY/commits?path=.ring/manifest.json&per_page=1" --jq '.[0].sha')"
          curl -fsSL --proto '=https' \
            "https://raw.githubusercontent.com/$TARGET_REPOSITORY/$target_commit/.ring/manifest.json" \
            -o applied-manifest.json
          PYTHONPATH=authority/scripts python authority/scripts/target_receiver.py acknowledge \
            --request request.json --request-commit "$request_commit" \
            --request-path "$request_path" --current applied-manifest.json \
            --target-manifest-commit "$target_commit" --output applied.json \
            --target-ring "$TARGET_RING" --target-repository "$TARGET_REPOSITORY"
          sequence="$(python -c 'import json; print(json.load(open("request.json"))["sequence"])')"
          request_id="$(python -c 'import json; print(json.load(open("request.json"))["promotion_id"])')"
          ack_path=".ring/applied/$(printf '%020d' "$sequence")-$request_id.json"
          applied_sha="$(gh api "repos/$TARGET_REPOSITORY/contents/$ack_path?ref=main" --jq .sha 2>/dev/null || true)"
          if [ -n "$applied_sha" ]; then
            gh api "repos/$TARGET_REPOSITORY/contents/$ack_path?ref=main" --jq .content \
              | base64 --decode > existing-applied.json
            cmp -s existing-applied.json applied.json
          else
            content="$(base64 < applied.json | tr -d '\n')"
            gh api "repos/$TARGET_REPOSITORY/contents/$ack_path" --method PUT \
              -f "message=ring: acknowledge sequence $sequence" -f "content=$content" -f branch=main
          fi
          python - "$sequence" <<'PY'
          import json,sys
          a=json.load(open("applied.json"))
          json.dump({"schema":"openrappter-applied-cursor/v1","sequence":int(sys.argv[1]),"request_id":a["request_id"],"request_sha256":a["request_sha256"]},open("cursor.json","w"),indent=2,sort_keys=True)
          PY
          cursor_sha="$(gh api "repos/$TARGET_REPOSITORY/contents/.ring/applied-cursor.json?ref=main" --jq .sha 2>/dev/null || true)"
          content="$(base64 < cursor.json | tr -d '\n')"
          args=(--method PUT -f "message=ring: advance applied cursor $sequence" -f "content=$content" -f branch=main)
          if [ -n "$cursor_sha" ]; then args+=(-f "sha=$cursor_sha"); fi
          gh api "repos/$TARGET_REPOSITORY/contents/.ring/applied-cursor.json" "${args[@]}"
          python - "$finalized" <<'PY'
          import json,sys
          json.dump({"schema":"openrappter-finalized-cursor/v1","sequence":int(sys.argv[1])},open("finalized-cursor.json","w"),indent=2,sort_keys=True)
          PY
          finalized_sha="$(gh api "repos/$TARGET_REPOSITORY/contents/.ring/finalized-cursor.json?ref=main" --jq .sha 2>/dev/null || true)"
          content="$(base64 < finalized-cursor.json | tr -d '\n')"
          args=(--method PUT -f "message=ring: observe finalized cursor $finalized" -f "content=$content" -f branch=main)
          if [ -n "$finalized_sha" ]; then args+=(-f "sha=$finalized_sha"); fi
          gh api "repos/$TARGET_REPOSITORY/contents/.ring/finalized-cursor.json" "${args[@]}"
