name: Promote immutable ring pointer

on:
  workflow_call:
    inputs:
      source_manifest_url: { required: true, type: string }
      target_ring: { required: true, type: string }
    secrets:
      RING_AUTHORITY_TOKEN: { required: false }
  workflow_dispatch:
    inputs:
      source_manifest_url:
        description: Immutable predecessor manifest URL
        required: true
        type: string
      target_ring:
        description: alpha, canary, beta, or stable
        required: true
        type: choice
        options: [alpha, canary, beta, stable]

permissions:
  contents: read

concurrency:
  group: ring-promotion-${{ inputs.target_ring }}
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail closed without cross-repository authority
        env:
          RING_AUTHORITY_TOKEN: ${{ secrets.RING_AUTHORITY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${RING_AUTHORITY_TOKEN:-}" ]; then
            echo "::error::RING_AUTHORITY_TOKEN is required; no dispatch occurred"
            exit 1
          fi
      - name: Validate, apply, confirm, and receipt exactly once
        env:
          GH_TOKEN: ${{ secrets.RING_AUTHORITY_TOKEN }}
          SOURCE_MANIFEST_URL: ${{ inputs.source_manifest_url }}
          TARGET_RING: ${{ inputs.target_ring }}
          AUTHORITY_CODE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          python - "$SOURCE_MANIFEST_URL" <<'PY'
          import re, sys
          if not re.fullmatch(
              r"https://raw\.githubusercontent\.com/kody-w/"
              r"openrappter-(?:nightly|alpha|canary|beta)/[0-9a-f]{40}/"
              r"\.ring/manifest\.json", sys.argv[1]
          ):
              raise SystemExit("source manifest URL is not immutable and allowlisted")
          PY
          target_repo="$(python - "$TARGET_RING" <<'PY'
          import sys
          print("kody-w/openrappter" if sys.argv[1] == "stable" else f"kody-w/openrappter-{sys.argv[1]}")
          PY
          )"
          curl -fsSL --proto '=https' "$SOURCE_MANIFEST_URL" -o source.json
          target_head="$(gh api "repos/$target_repo/commits/main" --jq .sha)"
          curl -fsSL --proto '=https' \
            "https://raw.githubusercontent.com/$target_repo/$target_head/.ring/manifest.json" \
            -o previous.json
          git clone --filter=blob:none https://github.com/kody-w/openrappter.git canonical
          python scripts/ringctl.py promote source.json --to "$TARGET_RING" \
            --previous previous.json --checkout canonical \
            --target-base-commit "$target_head" > payload.json
          promotion_id="$(python -c 'import json; print(json.load(open("payload.json"))["promotion_id"])')"
          proposed_sha="$(python -c 'import json; print(json.load(open("payload.json"))["target_manifest_sha256"])')"
          artifact_url="$(python -c 'import json; print(json.load(open("payload.json"))["artifact_url"])')"
          artifact_sha="$(python -c 'import json; print(json.load(open("payload.json"))["artifact_sha256"])')"
          receipt_path="receipts/$TARGET_RING/$promotion_id.json"
          curl -fsSL --proto '=https' "$artifact_url" -o artifact
          echo "$artifact_sha  artifact" | sha256sum -c -

          # A completed retry confirms and returns. It never redispatches and
          # never creates a second receipt.
          if gh api "repos/kody-w/openrappter-release-train/contents/$receipt_path?ref=main" \
              --jq .content 2>/dev/null | base64 --decode > existing-receipt.json; then
            python - "$target_repo" "$TARGET_RING" "$proposed_sha" "$promotion_id" <<'PY'
          import hashlib, json, sys, urllib.request
          repo, ring, expected, promotion_id = sys.argv[1:]
          manifest = json.load(urllib.request.urlopen(f"https://raw.githubusercontent.com/{repo}/main/.ring/manifest.json"))
          canonical = json.dumps(manifest, sort_keys=True, separators=(",", ":")).encode()
          receipt = json.load(open("existing-receipt.json"))
          assert hashlib.sha256(canonical).hexdigest() == expected == receipt["target_manifest_sha256"]
          assert manifest["promotion_id"] == promotion_id == receipt["promotion_id"]
          assert receipt["target_repository"] == repo and receipt["target_ring"] == ring
          PY
            exit 0
          fi

          current_sha="$(TARGET_REPO="$target_repo" python - <<'PY'
          import json, hashlib, urllib.request, os
          repo=os.environ["TARGET_REPO"]
          value=json.load(urllib.request.urlopen(f"https://raw.githubusercontent.com/{repo}/main/.ring/manifest.json"))
          print(hashlib.sha256(json.dumps(value,sort_keys=True,separators=(",",":")).encode()).hexdigest())
          PY
          )"
          if [ "$current_sha" != "$proposed_sha" ]; then
            python - <<'PY'
          import json
          payload=json.load(open("payload.json"))
          json.dump({"event_type":"ring-promotion","client_payload":payload},open("dispatch.json","w"))
          PY
            gh api "repos/$target_repo/dispatches" --method POST --input dispatch.json
          fi

          confirmed=false
          for _ in $(seq 1 30); do
            if curl -fsSL --proto '=https' \
                "https://raw.githubusercontent.com/$target_repo/main/.ring/manifest.json" \
                -o confirmed.json; then
              actual="$(python -c 'import json,hashlib; v=json.load(open("confirmed.json")); print(hashlib.sha256(json.dumps(v,sort_keys=True,separators=(",",":")).encode()).hexdigest())')"
              if [ "$actual" = "$proposed_sha" ]; then confirmed=true; break; fi
            fi
            sleep 10
          done
          [ "$confirmed" = true ] || { echo "::error::target never acknowledged exact manifest"; exit 1; }
          target_manifest_commit="$(gh api "repos/$target_repo/commits/main" --jq .sha)"
          curl -fsSL --proto '=https' \
            "https://raw.githubusercontent.com/$target_repo/$target_manifest_commit/.ring/manifest.json" \
            -o immutable-target.json
          cmp -s <(python -c 'import json; print(json.dumps(json.load(open("confirmed.json")),sort_keys=True,separators=(",",":")))' ) \
            <(python -c 'import json; print(json.dumps(json.load(open("immutable-target.json")),sort_keys=True,separators=(",",":")))' )
          emitted_at="$(gh api "repos/$target_repo/commits/$target_manifest_commit" --jq .commit.committer.date)"
          python scripts/ringctl.py receipt payload.json \
            --target-manifest-commit "$target_manifest_commit" \
            --emitted-at "$emitted_at" --out receipt.json
          content="$(base64 < receipt.json | tr -d '\n')"
          if ! gh api "repos/kody-w/openrappter-release-train/contents/$receipt_path" \
              --method PUT -f "message=receipt: $TARGET_RING $promotion_id" \
              -f content="$content" -f branch=main > receipt-result.json; then
            gh api "repos/kody-w/openrappter-release-train/contents/$receipt_path?ref=main" \
              --jq .content | base64 --decode > raced-receipt.json
            cmp -s receipt.json raced-receipt.json
          fi
          authority_commit="$(if [ -s receipt-result.json ]; then python -c 'import json; print(json.load(open("receipt-result.json"))["commit"]["sha"])'; else gh api "repos/kody-w/openrappter-release-train/commits?path=$receipt_path&per_page=1" --jq '.[0].sha'; fi)"
          receipt_sha="$(python -c 'import json,hashlib; v=json.load(open("receipt.json")); print(hashlib.sha256(json.dumps(v,sort_keys=True,separators=(",",":")).encode()).hexdigest())')"
          python - "$authority_commit" "$receipt_path" "$receipt_sha" "$promotion_id" "$target_manifest_commit" <<'PY'
          import json,sys
          authority_commit,path,sha,promotion_id,target_commit=sys.argv[1:]
          payload={"authority_repository":"kody-w/openrappter-release-train","authority_commit":authority_commit,"receipt_path":path,"receipt_sha256":sha,"promotion_id":promotion_id,"target_manifest_commit":target_commit}
          json.dump({"event_type":"ring-receipt","client_payload":payload},open("receipt-dispatch.json","w"))
          PY
          gh api "repos/$target_repo/dispatches" --method POST --input receipt-dispatch.json
