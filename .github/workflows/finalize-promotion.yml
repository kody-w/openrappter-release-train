name: Finalize promotion
on:
  workflow_dispatch:
    inputs:
      request_commit: { required: true, type: string }
      request_path: { required: true, type: string }
permissions:
  contents: write
concurrency:
  group: finalize-${{ inputs.request_path }}
  cancel-in-progress: false
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_COMMIT: ${{ inputs.request_commit }}
          REQUEST_PATH: ${{ inputs.request_path }}
        run: |
          set -euo pipefail
          printf '%s' "$REQUEST_COMMIT" | grep -Eq '^[0-9a-f]{40}$'
          curl -fsSL --proto '=https' \
            "https://raw.githubusercontent.com/kody-w/openrappter-release-train/$REQUEST_COMMIT/$REQUEST_PATH" \
            -o request.json
          target_repo="$(python -c 'import json; print(json.load(open("request.json"))["target_repository"])')"
          target_ring="$(python -c 'import json; print(json.load(open("request.json"))["to"])')"
          request_id="$(python -c 'import json; print(json.load(open("request.json"))["promotion_id"])')"
          request_sha="$(python -c 'import json,hashlib; v=json.load(open("request.json")); print(hashlib.sha256(json.dumps(v,sort_keys=True,separators=(",",":")).encode()).hexdigest())')"
          found=false
          for _ in $(seq 1 30); do
            if curl -fsSL --proto '=https' \
                "https://raw.githubusercontent.com/$target_repo/main/.ring/applied.json" \
                -o applied.json; then
              if python - "$request_id" "$request_sha" "$REQUEST_COMMIT" "$REQUEST_PATH" <<'PY'
          import json,sys
          a=json.load(open("applied.json"))
          assert a["schema"]=="openrappter-applied-request/v1"
          assert [a["request_id"],a["request_sha256"],a["request_authority_commit"],a["request_path"]]==sys.argv[1:]
          PY
              then found=true; break; fi
            fi
            sleep 10
          done
          [ "$found" = true ] || { echo "::error::missing/mismatched target acknowledgement"; exit 1; }
          target_commit="$(python -c 'import json; print(json.load(open("applied.json"))["target_manifest_commit"])')"
          curl -fsSL --proto '=https' \
            "https://raw.githubusercontent.com/$target_repo/$target_commit/.ring/manifest.json" \
            -o target.json
          python - <<'PY'
          import json,hashlib
          q=json.load(open("request.json")); a=json.load(open("applied.json")); m=json.load(open("target.json"))
          digest=lambda v:hashlib.sha256(json.dumps(v,sort_keys=True,separators=(",",":")).encode()).hexdigest()
          assert m==q["target_manifest"]
          assert digest(m)==q["target_manifest_sha256"]==a["target_manifest_sha256"]
          assert a["target_repository"]==q["target_repository"] and a["target_ring"]==q["to"]
          PY
          receipt_path="receipts/$target_ring/$request_id.json"
          emitted_at="$(gh api "repos/$target_repo/commits/$target_commit" --jq .commit.committer.date)"
          python scripts/ringctl.py receipt request.json \
            --target-manifest-commit "$target_commit" --emitted-at "$emitted_at" \
            --out receipt.json
          if gh api "repos/kody-w/openrappter-release-train/contents/$receipt_path?ref=main" \
              --jq .content 2>/dev/null | base64 --decode > existing.json; then
            cmp -s existing.json receipt.json
            exit 0
          fi
          content="$(base64 < receipt.json | tr -d '\n')"
          gh api "repos/kody-w/openrappter-release-train/contents/$receipt_path" \
            --method PUT -f "message=receipt: finalize $target_ring $request_id" \
            -f content="$content" -f branch=main
