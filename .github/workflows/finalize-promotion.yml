name: Finalize promotion
on:
  workflow_dispatch:
    inputs:
      request_commit: { required: true, type: string }
      request_path: { required: true, type: string }
permissions:
  contents: write
concurrency:
  group: finalize-${{ inputs.request_path }}
  cancel-in-progress: false
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_COMMIT: ${{ inputs.request_commit }}
          REQUEST_PATH: ${{ inputs.request_path }}
        run: |
          set -euo pipefail
          printf '%s' "$REQUEST_COMMIT" | grep -Eq '^[0-9a-f]{40}$'
          curl -fsSL --proto '=https' \
            "https://raw.githubusercontent.com/kody-w/openrappter-release-train/$REQUEST_COMMIT/$REQUEST_PATH" \
            -o request.json
          target_repo="$(python -c 'import json; print(json.load(open("request.json"))["target_repository"])')"
          target_ring="$(python -c 'import json; print(json.load(open("request.json"))["to"])')"
          request_id="$(python -c 'import json; print(json.load(open("request.json"))["promotion_id"])')"
          request_sha="$(python -c 'import json,hashlib; v=json.load(open("request.json")); print(hashlib.sha256(json.dumps(v,sort_keys=True,separators=(",",":")).encode()).hexdigest())')"
          found=false
          if [ "$target_ring" = stable ]; then
            branch="ring/stable-${request_id:0:16}"
            pr="$(gh api "repos/kody-w/openrappter/pulls?state=closed&head=kody-w:$branch" --jq '.[0]')"
            target_commit="$(printf '%s' "$pr" | python -c 'import json,sys; p=json.load(sys.stdin); assert p["merged_at"]; print(p["merge_commit_sha"])')"
            curl -fsSL --proto '=https' \
              "https://raw.githubusercontent.com/kody-w/openrappter/$target_commit/.ring/manifest.json" \
              -o target.json
            curl -fsSL --proto '=https' \
              "https://raw.githubusercontent.com/kody-w/openrappter/$target_commit/.ring/stable-applied-request.json" \
              -o stable-applied.json
            python - "$target_commit" "$REQUEST_COMMIT" <<'PY'
          import json,sys
          target_commit,request_commit=sys.argv[1:]
          q=json.load(open("request.json")); s=json.load(open("stable-applied.json"))
          assert s["schema"]=="openrappter-stable-applied-request/v1"
          assert s["request_id"]==q["promotion_id"] and s["request_sequence"]==q["sequence"]
          assert s["request_sha256"]==__import__("hashlib").sha256(json.dumps(q,sort_keys=True,separators=(",",":")).encode()).hexdigest()
          assert s["request_path"].endswith(f"{q['sequence']:020d}-{q['promotion_id']}.json")
          json.dump({"schema":"openrappter-applied-request/v1","request_id":q["promotion_id"],"request_sequence":q["sequence"],"request_sha256":s["request_sha256"],"request_authority_commit":request_commit,"request_path":s["request_path"],"target_repository":"kody-w/openrappter","target_ring":"stable","target_manifest_sha256":s["target_manifest_sha256"],"target_manifest_commit":target_commit},open("applied.json","w"))
          PY
            found=true
          else
            for _ in $(seq 1 30); do
              if curl -fsSL --proto '=https' \
                  "https://raw.githubusercontent.com/$target_repo/main/.ring/applied.json" \
                  -o applied.json; then
                if python - "$request_id" "$request_sha" "$REQUEST_COMMIT" "$REQUEST_PATH" <<'PY'
          import json,sys
          a=json.load(open("applied.json"))
          assert a["schema"]=="openrappter-applied-request/v1"
          assert [a["request_id"],a["request_sha256"],a["request_authority_commit"],a["request_path"]]==sys.argv[1:]
          PY
                then found=true; break; fi
              fi
              sleep 10
            done
          fi
          [ "$found" = true ] || { echo "::error::missing/mismatched target acknowledgement"; exit 1; }
          if [ "$target_ring" != stable ]; then
            target_commit="$(python -c 'import json; print(json.load(open("applied.json"))["target_manifest_commit"])')"
            curl -fsSL --proto '=https' \
              "https://raw.githubusercontent.com/$target_repo/$target_commit/.ring/manifest.json" \
              -o target.json
          fi
          verified_commit="$(python scripts/ringctl.py validate-applied \
            --request request.json --applied applied.json --manifest target.json)"
          test "$verified_commit" = "$target_commit"
          receipt_path="receipts/$target_ring/$request_id.json"
          emitted_at="$(gh api "repos/$target_repo/commits/$target_commit" --jq .commit.committer.date)"
          python scripts/ringctl.py receipt request.json \
            --target-manifest-commit "$target_commit" --emitted-at "$emitted_at" \
            --out receipt.json
          receipt_created=false
          if gh api "repos/kody-w/openrappter-release-train/contents/$receipt_path?ref=main" \
              --jq .content 2>/dev/null | base64 --decode > existing.json; then
            cmp -s existing.json receipt.json
            authority_commit="$(gh api "repos/kody-w/openrappter-release-train/commits?path=$receipt_path&per_page=1" --jq '.[0].sha')"
          else
            content="$(base64 < receipt.json | tr -d '\n')"
            gh api "repos/kody-w/openrappter-release-train/contents/$receipt_path" \
              --method PUT -f "message=receipt: finalize $target_ring $request_id" \
              -f content="$content" -f branch=main > receipt-result.json
            authority_commit="$(python -c 'import json; print(json.load(open("receipt-result.json"))["commit"]["sha"])')"
            receipt_created=true
          fi
          receipt_sha="$(python -c 'import json,hashlib; v=json.load(open("receipt.json")); print(hashlib.sha256(json.dumps(v,sort_keys=True,separators=(",",":")).encode()).hexdigest())')"
          head_path="heads/$target_ring.json"
          existing_head_sha="$(gh api "repos/kody-w/openrappter-release-train/contents/$head_path?ref=main" --jq .sha 2>/dev/null || true)"
          head_args=()
          if [ -n "$existing_head_sha" ]; then
            gh api "repos/kody-w/openrappter-release-train/contents/$head_path?ref=main" --jq .content \
              | base64 --decode > existing-head.json
            previous_authority="$(python -c 'import json; print(json.load(open("existing-head.json"))["authority_commit"])')"
            previous_path="$(python -c 'import json; print(json.load(open("existing-head.json"))["receipt_path"])')"
            curl -fsSL --proto '=https' \
              "https://raw.githubusercontent.com/kody-w/openrappter-release-train/$previous_authority/$previous_path" \
              -o previous-receipt.json
            git clone --filter=blob:none https://github.com/kody-w/openrappter.git canonical
            head_args+=(--existing existing-head.json --previous-receipt previous-receipt.json --checkout canonical)
          fi
          head_state="$(python scripts/ringctl.py head --receipt receipt.json \
            --authority-commit "$authority_commit" --receipt-path "$receipt_path" \
            --receipt-sha256 "$receipt_sha" --out head.json "${head_args[@]}")"
          if [ "$head_state" = "changed" ]; then
            content="$(base64 < head.json | tr -d '\n')"
            api_args=(--method PUT -f "message=head: $target_ring $request_id" -f "content=$content" -f branch=main)
            if [ -n "$existing_head_sha" ]; then api_args+=(-f "sha=$existing_head_sha"); fi
            gh api "repos/kody-w/openrappter-release-train/contents/$head_path" "${api_args[@]}"
          fi
          echo "finalized receipt=$receipt_created head=$head_state"
